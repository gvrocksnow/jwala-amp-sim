# Builds Jwala (standalone app + VST3 + CLAP) for Windows, macOS and Linux.
# Runs only when started by hand (Actions → Build → Run workflow). Every run uploads the packaged
# binaries as workflow artifacts. Filling in "Release tag" (or running it on a `v*` tag) also
# attaches them to a GitHub release for that tag, creating the tag on the built commit if needed.
name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0) — leave empty to only build
        required: false
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: rust

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          # Apple Silicon + Intel in one universal binary, cross-compiled on the arm64 runner
          - { name: macos-universal, os: macos-latest, targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
          - { name: linux-x64,   os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # When releasing, stamp the tag's version (v1.2.3 → 1.2.3) into Cargo.toml and Cargo.lock so the
      # plugin, the UI and the macOS bundles all report it; otherwise keep the version in Cargo.toml.
      - name: Set version
        env:
          TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tag '$TAG' isn't a version like v1.2.3"
              exit 1
            fi
            perl -0pi -e 's/^version = "[^"]*"/version = "'"$version"'"/m' Cargo.toml
            perl -0pi -e 's/(name = "jwala"\r?\nversion = ")[^"]*/${1}'"$version"'/' Cargo.lock
          else
            version=$(perl -ne 'if (/^version = "([^"]*)"/) { print $1; exit }' Cargo.toml)
          fi
          echo "JWALA_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building Jwala $version"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev \
            libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev \
            libgl1-mesa-dev libvulkan-dev

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --locked

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target"
          done
          # merge each arm64/x86_64 pair into one universal binary under target/release
          mkdir -p target/release
          for file in jwala libjwala_plugin.dylib; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$file" \
              "target/x86_64-apple-darwin/release/$file" \
              -output "target/release/$file"
          done
          lipo -info target/release/jwala target/release/libjwala_plugin.dylib

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          dist=dist/Jwala-${{ matrix.name }}
          mkdir -p "$dist/Jwala.vst3/Contents/x86_64-win"
          cp target/release/jwala.exe "$dist/Jwala.exe"
          cp target/release/jwala_plugin.dll "$dist/Jwala.vst3/Contents/x86_64-win/Jwala.vst3"
          cp target/release/jwala_plugin.dll "$dist/Jwala.clap"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          dist=dist/Jwala-${{ matrix.name }}
          mkdir -p "$dist"
          cp target/release/jwala "$dist/Jwala"
          for kind in vst3 clap; do
            bundle="$dist/Jwala.$kind/Contents"
            mkdir -p "$bundle/MacOS"
            cp target/release/libjwala_plugin.dylib "$bundle/MacOS/Jwala"
            cat > "$bundle/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Jwala</string>
            <key>CFBundleIdentifier</key><string>com.gvrocksnow.jwala.$kind</string>
            <key>CFBundleName</key><string>Jwala</string>
            <key>CFBundlePackageType</key><string>BNDL</string>
            <key>CFBundleShortVersionString</key><string>$JWALA_VERSION</string>
          </dict>
          </plist>
          EOF
            echo "BNDL????" > "$bundle/PkgInfo"
          done
          # ad-hoc signature so Apple Silicon hosts will load the bundles
          codesign --force --deep --sign - "$dist/Jwala.vst3" "$dist/Jwala.clap" "$dist/Jwala"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dist=dist/Jwala-${{ matrix.name }}
          mkdir -p "$dist/Jwala.vst3/Contents/x86_64-linux"
          cp target/release/jwala "$dist/Jwala"
          cp target/release/libjwala_plugin.so "$dist/Jwala.vst3/Contents/x86_64-linux/Jwala.so"
          cp target/release/libjwala_plugin.so "$dist/Jwala.clap"

      - name: Archive
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "Jwala-$JWALA_VERSION-${{ matrix.name }}.zip" "Jwala-${{ matrix.name }}"
          else
            zip -ry "Jwala-$JWALA_VERSION-${{ matrix.name }}.zip" "Jwala-${{ matrix.name }}"
          fi

      # upload the zip rather than the folder: artifact storage drops Unix permissions (the executable bit)
      - uses: actions/upload-artifact@v4
        with:
          name: Jwala-${{ env.JWALA_VERSION }}-${{ matrix.name }}
          path: rust/dist/Jwala-${{ env.JWALA_VERSION }}-${{ matrix.name }}.zip

      - name: Attach to release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: rust/dist/Jwala-${{ env.JWALA_VERSION }}-${{ matrix.name }}.zip
