[package]
name = "jwala"
version = "0.3.2"
edition = "2021"
description = "Jwala amp & effects rig"
license = "GPL-3.0-or-later"

[lib]
name = "jwala_plugin"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "jwala"
path = "src/main.rs"

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de42101", features = ["standalone"] }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "579130ecb4f9f315ae52190af42f0ea46aeaa4a2" }
raw-window-handle = "0.5"
rwh06 = { package = "raw-window-handle", version = "0.6" }
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17"
cpal = "0.15"
atomic_float = "0.1"
keyboard-types = { version = "0.6", default-features = false }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# standalone self-update (standalone/update.rs). HTTPS through the OS's own TLS (SChannel on
# Windows, Security.framework on macOS, OpenSSL on Linux): rustls' `ring` needs a full C toolchain
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# the Dock icon when the standalone runs outside a .app bundle (same version baseview uses)
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
# the startup splash's NSWindow (src/splash/macos.rs); the version baseview uses
cocoa = "0.24"

# the startup splash's X11 window and hiding the main window until it has drawn (src/splash/linux.rs,
# src/reveal.rs); the version baseview uses
[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }
# build OpenSSL into the binary: distros ship libssl.so.1.1 or libssl.so.3, never both, so linking
# the system one breaks on half of them ("libssl.so...: cannot open shared object file")
native-tls = { version = "0.2", features = ["vendored"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

# baseview with one change: X11 windows use the parent's visual instead of 32-bit ARGB (see
# vendor/baseview/src/x11/visual_info.rs). Same revision nih-plug and we already pin.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "vendor/baseview" }
